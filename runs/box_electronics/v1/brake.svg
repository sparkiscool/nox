<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="100%" style="max-width:1180px;height:auto" role="img"><style>
.bg{fill:var(--bg,#ffffff)} .sheet{fill:var(--sheet,#eef3f6);stroke:var(--line,#8a97a3);stroke-width:1}
.ko{fill:var(--ko,#e2e2e2);stroke:var(--line,#8a97a3);stroke-dasharray:4 3}
.fix{fill:var(--fix,#dfe8f0);stroke:var(--ink,#1d2730);stroke-width:1}
.brd{fill:var(--brd,#fff4d8);stroke:var(--ink,#1d2730);stroke-width:1}
.pwr{fill:var(--pwr,#ffe1dc);stroke:var(--ink,#1d2730);stroke-width:1}
.sig{fill:var(--sig,#e1f0e4);stroke:var(--ink,#1d2730);stroke-width:1}
.off{fill:var(--off,#ececf6);stroke:var(--ink,#1d2730);stroke-width:1;stroke-dasharray:5 3}
.t{font:11px system-ui,sans-serif;fill:var(--ink,#1d2730)} .ts{font:9px system-ui,sans-serif;fill:var(--muted,#55626e)}
.tb{font:bold 12px system-ui,sans-serif;fill:var(--ink,#1d2730)}
.w24{stroke:var(--c24,#c0392b);stroke-width:2.2;fill:none} .w13{stroke:var(--c13,#d35400);stroke-width:1.8;fill:none}
.w6{stroke:var(--c6,#8e44ad);stroke-width:1.6;fill:none} .w5{stroke:var(--c5,#2471a3);stroke-width:1.4;fill:none}
.wch{stroke:var(--cch,#b7950b);stroke-width:2;fill:none} .wsg{stroke:var(--csg,#1e8449);stroke-width:1.1;fill:none;stroke-dasharray:3 2}
.wst{stroke:var(--cst,#34495e);stroke-width:1.6;fill:none} .wm{stroke:var(--cm,#7b241c);stroke-width:2.6;fill:none}
.arr{stroke:var(--ink,#1d2730);stroke-width:1.2;fill:none;marker-end:url(#ah)} .ab{stroke:var(--c24,#c0392b);stroke-width:1;fill:none;stroke-dasharray:4 3}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="bg" x="0" y="0" width="1180" height="820"/><text class="tb" x="20" y="24">Brake: one DPDT relay per motor (KB1 head A, KB2 head B, KB3 axle), drawn de-energised = braked</text><rect class="brd" x="30" y="60" width="170" height="250" rx="5"/><text class="tb" x="38" y="78">TMC2209 (SKR)</text><text class="ts" x="38" y="93">head A shown; B, axle same</text><text class="ts" x="120" y="114">A1 (out 1)</text><circle cx="200" cy="110" r="3.2" fill="currentColor"/><text class="ts" x="120" y="164">A2 (out 2)</text><circle cx="200" cy="160" r="3.2" fill="currentColor"/><text class="ts" x="120" y="224">B1 (out 1)</text><circle cx="200" cy="220" r="3.2" fill="currentColor"/><text class="ts" x="120" y="274">B2 (out 2)</text><circle cx="200" cy="270" r="3.2" fill="currentColor"/><rect class="pwr" x="330" y="60" width="260" height="250" rx="5"/><text class="tb" x="338" y="78">KB1: G2RL-2 DC24 (DPDT, 8 A)</text><text class="ts" x="338" y="93">pole 1 = coil A, pole 2 = coil B</text><circle cx="440" cy="118" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><text class="ts" x="446" y="122">NO</text><circle cx="440" cy="162" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><text class="ts" x="446" y="166">NC</text><circle cx="380" cy="140" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path class="wst" d="M383,141 L437,160"/><text class="ts" x="364" y="130">pole 1 COM</text><circle cx="440" cy="228" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><text class="ts" x="446" y="232">NO</text><circle cx="440" cy="272" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><text class="ts" x="446" y="276">NC</text><circle cx="380" cy="250" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path class="wst" d="M383,251 L437,270"/><text class="ts" x="364" y="240">pole 2 COM</text><rect class="off" x="760" y="60" width="190" height="250" rx="5"/><text class="tb" x="768" y="78">NEMA17 (head A)</text><text class="ts" x="768" y="93">own pigtail, JST-XH inline</text><path class="wst" d="M850,120 c 30,0 30,20 0,20 c 30,0 30,20 0,20 c 30,0 30,20 0,20"/><text class="ts" x="890" y="155">coil A</text><path class="wst" d="M850,230 c 30,0 30,20 0,20 c 30,0 30,20 0,20 c 30,0 30,20 0,20"/><text class="ts" x="890" y="265">coil B</text><path class="wst" d="M200,110 L300,110 L300,118 L440,118"/><text class="ts" x="208" y="104">driver out 1 to NO</text><path class="wst" d="M380,140 L350,140 L350,96 L700,96 L700,120 L850,120"/><text class="ts" x="560" y="90">COM to coil wire 1</text><path class="wst" d="M440,162 L620,162 L620,180 L850,180"/><text class="ts" x="470" y="180">NC to coil wire 2</text><path class="wst" d="M200,160 L260,160 L260,196 L660,196 L660,180"/><text class="ts" x="268" y="174">driver out 2 to coil wire 2 (always)</text><circle cx="620" cy="180" r="3.2" fill="currentColor"/><circle cx="660" cy="180" r="3.2" fill="currentColor"/><path class="wst" d="M200,220 L300,220 L300,228 L440,228"/><path class="wst" d="M380,250 L350,250 L350,206 L700,206 L700,230 L850,230"/><path class="wst" d="M440,272 L620,272 L620,290 L850,290"/><path class="wst" d="M200,270 L260,270 L260,300 L660,300 L660,290"/><circle cx="620" cy="290" r="3.2" fill="currentColor"/><circle cx="660" cy="290" r="3.2" fill="currentColor"/><rect class="sig" x="330" y="360" width="260" height="80" rx="5"/><text class="tb" x="338" y="378">ULN2003A (bare DIP)</text><text class="ts" x="338" y="393">COM pin 9 to 24 V: the flyback diodes</text><rect class="brd" x="30" y="360" width="170" height="80" rx="5"/><text class="tb" x="38" y="378">SKR EXP1 pin</text><text class="ts" x="38" y="393">[output_pin head_a_brake] (CHECK pins)</text><path class="wsg" d="M200,400 L330,400"/><text class="ts" x="208" y="394">high = released</text><path class="w24" d="M700,380 L700,340 L470,340 L470,310"/><text class="ts" x="706" y="396">24 V to the relay coil + and ULN COM</text><path class="w24" d="M700,380 L590,380"/><path class="wsg" d="M590,420 L620,420 L620,330 L540,330 L540,310"/><text class="ts" x="596" y="436">OUT1 sinks the relay coil -</text><text class="ts" x="30" y="476">De-energised (pin low, power off, E-stop, Klipper shutdown): out 1 is open on NO and each coil is shorted on itself through NC, so the motor brakes and the driver is never shorted.</text><text class="ts" x="30" y="494">Start: brake pin high, dwell 30 ms, MANUAL_STEPPER ENABLE=1, move. Stop: ENABLE=0, dwell 30 ms, pin low; re-enable only after a further 50 ms (NC closes ~35 ms, E).</text><text class="tb" x="20" y="540">Keep-alive and seat sense (panel v9 plain pins on the drone's lower-ring pads; runs/keepalive_contacts/concept)</text><rect class="pwr" x="30" y="560" width="140" height="60" rx="5"/><text class="tb" x="38" y="578">Keep-alive buck</text><text class="ts" x="38" y="593">13.0 V CV, 3.0 A CC</text><rect class="pwr" x="210" y="560" width="90" height="60" rx="5"/><text class="tb" x="218" y="578">K1</text><text class="ts" x="218" y="593">relay ch 1</text><rect class="sig" x="340" y="560" width="110" height="60" rx="5"/><text class="tb" x="348" y="578">INA226 0x41</text><text class="ts" x="348" y="593">R010 shunt</text><rect class="off" x="700" y="550" width="150" height="80" rx="5"/><text class="tb" x="708" y="568">+x face: 2 pins</text><text class="ts" x="708" y="583">B+, panel v9 plain</text><rect class="off" x="700" y="690" width="150" height="80" rx="5"/><text class="tb" x="708" y="708">-x face: 2 pins</text><text class="ts" x="708" y="723">B- = box GND</text><rect class="off" x="960" y="550" width="200" height="220" rx="5"/><text class="tb" x="968" y="568">Drone</text><text class="ts" x="968" y="590">+ pad (lower ring, 22 x 12)</text><text class="ts" x="968" y="620">ideal diode (LM74700) to bus</text><text class="ts" x="968" y="650">10 kOhm across the pads</text><text class="ts" x="968" y="740">- pad</text><path class="wst" d="M1060,590 L1060,660"/><path class="wst" d="M1060,720 L1060,730"/><path class="w13" d="M170,590 L210,590"/><path class="w13" d="M300,590 L340,590"/><path class="w13" d="M450,590 L700,590"/><text class="ts" x="500" y="584">B+ 18 AWG, bullet at the sheet</text><path class="w13" d="M850,590 L960,590"/><text class="ts" x="858" y="584">spring pins</text><path class="w13" d="M850,730 L960,730"/><path class="w13" d="M700,730 L100,730 L100,620"/><text class="ts" x="108" y="724">B- 18 AWG to the buck -</text><path class="wst" d="M1060,660 L1060,675 l -6,4 l 12,6 l -12,6 l 12,6 l -12,6 l 6,4 L1060,720"/><circle cx="560" cy="590" r="3.2" fill="currentColor"/><path class="wsg" d="M560,590 L560,640"/><text class="ts" x="568" y="640">BAT54 (cathode up)</text><path d="M552,640 L568,640 L560,628 z" fill="currentColor"/><path class="wsg" d="M560,640 L560,670 L480,670"/><text class="ts" x="480" y="664">1 kOhm</text><path class="wsg" d="M480,670 L380,670"/><circle cx="520" cy="670" r="3.2" fill="currentColor"/><path class="wsg" d="M520,670 L520,700"/><text class="ts" x="528" y="704">5 V TVS, &#8804; 1 uA at 3.3 V</text><rect class="brd" x="220" y="650" width="160" height="60" rx="5"/><text class="tb" x="228" y="668">Pi GPIO 24</text><text class="ts" x="228" y="683">100 kOhm to 3.3 V</text><circle cx="620" cy="590" r="3.2" fill="currentColor"/><path class="w13" d="M620,590 L620,650"/><text class="ts" x="626" y="654">SMBJ15A to GND</text><text class="ts" x="30" y="802">K1 open, drone seated: 3.3 V, 100 kOhm, 1 kOhm, BAT54 into the drone's 10 kOhm: GPIO 24 ~0.52 V = low (E, CHECK). No drone: high. K1 closed: the line is at 13.0 V, the BAT54 blocks, GPIO reads high and boxd ignores it.</text></svg>