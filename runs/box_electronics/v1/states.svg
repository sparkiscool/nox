<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 862" width="100%" style="max-width:1000px;height:auto" role="img"><style>
.bg{fill:var(--bg,#ffffff)} .sheet{fill:var(--sheet,#eef3f6);stroke:var(--line,#8a97a3);stroke-width:1}
.ko{fill:var(--ko,#e2e2e2);stroke:var(--line,#8a97a3);stroke-dasharray:4 3}
.fix{fill:var(--fix,#dfe8f0);stroke:var(--ink,#1d2730);stroke-width:1}
.brd{fill:var(--brd,#fff4d8);stroke:var(--ink,#1d2730);stroke-width:1}
.pwr{fill:var(--pwr,#ffe1dc);stroke:var(--ink,#1d2730);stroke-width:1}
.sig{fill:var(--sig,#e1f0e4);stroke:var(--ink,#1d2730);stroke-width:1}
.off{fill:var(--off,#ececf6);stroke:var(--ink,#1d2730);stroke-width:1;stroke-dasharray:5 3}
.t{font:11px system-ui,sans-serif;fill:var(--ink,#1d2730)} .ts{font:9px system-ui,sans-serif;fill:var(--muted,#55626e)}
.tb{font:bold 12px system-ui,sans-serif;fill:var(--ink,#1d2730)}
.w24{stroke:var(--c24,#c0392b);stroke-width:2.2;fill:none} .w13{stroke:var(--c13,#d35400);stroke-width:1.8;fill:none}
.w6{stroke:var(--c6,#8e44ad);stroke-width:1.6;fill:none} .w5{stroke:var(--c5,#2471a3);stroke-width:1.4;fill:none}
.wch{stroke:var(--cch,#b7950b);stroke-width:2;fill:none} .wsg{stroke:var(--csg,#1e8449);stroke-width:1.1;fill:none;stroke-dasharray:3 2}
.wst{stroke:var(--cst,#34495e);stroke-width:1.6;fill:none} .wm{stroke:var(--cm,#7b241c);stroke-width:2.6;fill:none}
.arr{stroke:var(--ink,#1d2730);stroke-width:1.2;fill:none;marker-end:url(#ah)} .ab{stroke:var(--c24,#c0392b);stroke-width:1;fill:none;stroke-dasharray:4 3}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="862"/><text class="tb" x="20" y="24">Swap state machine (boxd on the Pi; DEFAULT, times E)</text><rect class="sig" x="20" y="44" width="150" height="34" rx="5"/><text class="tb" x="30" y="65">IDLE</text><text class="ts" x="182" y="57">drone away; live bays charge; heads parked; K1 open; latch in</text><text class="ts" x="182" y="71">pass: swap request from the mission script</text><path class="arr" d="M95,78 L95,89"/><rect class="sig" x="20" y="90" width="150" height="34" rx="5"/><text class="tb" x="30" y="111">PRESTAGE</text><text class="ts" x="182" y="103">head A picks the fullest charged pack (bay relay open and bay I < 50 mA first); head B waits ...</text><text class="ts" x="182" y="117">pass: both heads at pose, no stall</text><path class="ab" d="M770,107 L800,107"/><text class="ts" x="806" y="111">A5 stall (6 s)</text><path class="arr" d="M95,124 L95,135"/><rect class="sig" x="20" y="136" width="150" height="34" rx="5"/><text class="tb" x="30" y="157">WAIT_SEAT</text><text class="ts" x="182" y="149">drone lands under its own landing mode; kill at first touch</text><text class="ts" x="182" y="163">pass: seat sense low for 100 ms</text><path class="ab" d="M770,153 L800,153"/><text class="ts" x="806" y="157">no seat: mission retries the landing (30 s)</text><path class="arr" d="M95,170 L95,181"/><rect class="sig" x="20" y="182" width="150" height="34" rx="5"/><text class="tb" x="30" y="203">LATCH_OUT</text><text class="ts" x="182" y="195">PCA ch 0..3 to OUT (servo pulse per unit from calibration), seat sense ignored from here</text><text class="ts" x="182" y="209">pass: all 4 halls low within 0.5 s</text><path class="ab" d="M770,199 L800,199"/><text class="ts" x="806" y="203">A1 latch not out (0.5 s)</text><path class="arr" d="M95,216 L95,227"/><rect class="sig" x="20" y="228" width="150" height="34" rx="5"/><text class="tb" x="30" y="249">KA_ON</text><text class="ts" x="182" y="241">close K1 while the old pack is higher than 13.0 V (0 A through the pads)</text><text class="ts" x="182" y="255">pass: INA_KA bus 12.8..13.2 V and I < 0.5 A for 0.2 s</text><path class="ab" d="M770,245 L800,245"/><text class="ts" x="806" y="249">A3 keep-alive fault (0.5 s)</text><path class="arr" d="M95,262 L95,273"/><rect class="sig" x="20" y="274" width="150" height="34" rx="5"/><text class="tb" x="30" y="295">PULL</text><text class="ts" x="182" y="287">head B rises to 89.6, closes, retracts with the dead pack: the drone XT60 unmates under the p...</text><text class="ts" x="182" y="301">pass: stroke done, no stall, INA_KA I > 100 mA at the end of the stroke (pads carry the drone)</text><path class="ab" d="M770,291 L800,291"/><text class="ts" x="806" y="295">A4 pull / keep-alive lost (2 s)</text><path class="arr" d="M95,308 L95,319"/><rect class="sig" x="20" y="320" width="150" height="34" rx="5"/><text class="tb" x="30" y="341">TURN</text><text class="ts" x="182" y="333">axle 90 deg: head A to the top; <= 100 full steps/s through each notch; step target + the bay...</text><text class="ts" x="182" y="347">pass: no stall; hall state matches phi</text><path class="ab" d="M770,337 L800,337"/><text class="ts" x="806" y="341">A5 stall (1.1 s)</text><path class="arr" d="M95,354 L95,365"/><rect class="sig" x="20" y="366" width="150" height="34" rx="5"/><text class="tb" x="30" y="387">INSERT</text><text class="ts" x="182" y="379">head A extends, last 12 at <= 20 mm/s, cartridge to the bolt seat, 1 over-travel into the TPU...</text><text class="ts" x="182" y="393">pass: full stroke, no stall</text><path class="ab" d="M770,383 L800,383"/><text class="ts" x="806" y="387">A5 stall (2 s)</text><path class="arr" d="M95,400 L95,411"/><rect class="sig" x="20" y="412" width="150" height="34" rx="5"/><text class="tb" x="30" y="433">MATE_CHECK</text><text class="ts" x="182" y="425">hold the stroke; read INA_KA</text><text class="ts" x="182" y="439">pass: I < 50 mA within 1.0 s (the new pack carries the drone)</text><path class="ab" d="M770,429 L800,429"/><text class="ts" x="806" y="433">A6 mate fail (1 s)</text><path class="arr" d="M95,446 L95,457"/><rect class="sig" x="20" y="458" width="150" height="34" rx="5"/><text class="tb" x="30" y="479">RELEASE</text><text class="ts" x="182" y="471">gripper opens (bolts into the drone pockets), head A retracts to park</text><text class="ts" x="182" y="485">pass: park, no stall</text><path class="ab" d="M770,475 L800,475"/><text class="ts" x="806" y="479">A5 stall (1 s)</text><path class="arr" d="M95,492 L95,503"/><rect class="sig" x="20" y="504" width="150" height="34" rx="5"/><text class="tb" x="30" y="525">KA_OFF</text><text class="ts" x="182" y="517">open K1 (0 A: pack higher)</text><text class="ts" x="182" y="531">pass: INA_KA I < 50 mA before and bus < 1 V after</text><path class="ab" d="M770,521 L800,521"/><text class="ts" x="806" y="525">A3 keep-alive fault (0.3 s)</text><path class="arr" d="M95,538 L95,549"/><rect class="sig" x="20" y="550" width="150" height="34" rx="5"/><text class="tb" x="30" y="571">LATCH_IN</text><text class="ts" x="182" y="563">PCA ch 0..3 to IN</text><text class="ts" x="182" y="577">pass: all 4 halls high within 0.5 s</text><path class="ab" d="M770,567 L800,567"/><text class="ts" x="806" y="571">A11 latch stuck out (0.5 s)</text><path class="arr" d="M95,584 L95,595"/><rect class="sig" x="20" y="596" width="150" height="34" rx="5"/><text class="tb" x="30" y="617">READY</text><text class="ts" x="182" y="609">SWAP_DONE to the mission; the mission arms the drone; take off</text><text class="ts" x="182" y="623">pass: seat sense high (drone gone)</text><path class="ab" d="M770,613 L800,613"/><text class="ts" x="806" y="617">drone stays: mission decides (60 s)</text><path class="arr" d="M95,630 L95,641"/><rect class="brd" x="20" y="642" width="150" height="34" rx="5"/><text class="tb" x="30" y="663">STORE</text><text class="ts" x="182" y="655">axle to the free bay (the live bay when free); head B extends with the dead pack, bay relay o...</text><text class="ts" x="182" y="669">pass: full stroke, no stall</text><path class="ab" d="M770,659 L800,659"/><text class="ts" x="806" y="663">A5 stall (4 s)</text><path class="arr" d="M95,676 L95,687"/><rect class="brd" x="20" y="688" width="150" height="34" rx="5"/><text class="tb" x="30" y="709">BAY_MATE</text><text class="ts" x="182" y="701">relay open: read the bay INA226 bus voltage</text><text class="ts" x="182" y="715">pass: 13.0..17.0 V within 1.0 s</text><path class="ab" d="M770,705 L800,705"/><text class="ts" x="806" y="709">A7 bay mate fail (1 s)</text><path class="arr" d="M95,722 L95,733"/><rect class="brd" x="20" y="734" width="150" height="34" rx="5"/><text class="tb" x="30" y="755">CHARGE</text><text class="ts" x="182" y="747">close the bay relay at 0 A, start the charger channel</text><text class="ts" x="182" y="761">pass: charger done, or I < C/10 and rest voltage >= 4.15 V/cell</text><path class="ab" d="M770,751 L800,751"/><text class="ts" x="806" y="755">A8 charge fault</text><path class="arr" d="M95,768 L95,779"/><rect class="brd" x="20" y="780" width="150" height="34" rx="5"/><text class="tb" x="30" y="801">CHARGE_END</text><text class="ts" x="182" y="793">stop the channel; wait I < 50 mA; open the bay relay</text><text class="ts" x="182" y="807">pass: I < 50 mA then relay open</text><path class="ab" d="M770,797 L800,797"/><text class="ts" x="806" y="801">A8 charge fault (5 s)</text></svg>