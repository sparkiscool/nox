<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout v3 system v2</title>
<style>
:root { --bg:#f3f4f6; --fg:#1b2130; --muted:#667085; --panel:#ffffff; --line:#d9dde3; --line-2:#e8ebef; --accent:#2f6fde; --bad:#c7362b; --bad-soft:#fbe9e7;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#13161c; --fg:#e7e9ee; --muted:#98a2b3; --panel:#1b1f27; --line:#2d333d; --line-2:#262b34; --accent:#6ea0ff; --bad:#ff7b6e; --bad-soft:#3a1f1c; } }
:root[data-theme="dark"] { --bg:#13161c; --fg:#e7e9ee; --muted:#98a2b3; --panel:#1b1f27; --line:#2d333d; --line-2:#262b34; --accent:#6ea0ff; --bad:#ff7b6e; --bad-soft:#3a1f1c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--sans); }
.app { height: 100%; display: grid; gap: 10px; padding: 12px 16px; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto;
       grid-template-areas: "head head" "stage side" "bar side"; }
header { grid-area: head; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 17px; font-weight: 600; } h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
.chip { font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.stage { grid-area: stage; position: relative; min-height: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.views { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.views button, .bar button { font: 12px var(--mono); padding: 5px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.views button:hover, .bar button:hover { border-color: var(--accent); }
.hud { position: absolute; right: 10px; top: 10px; font: 12px/1.5 var(--mono); color: var(--muted); text-align: right; background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 4px 8px; border-radius: 4px; }
.bar { grid-area: bar; display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px 10px; align-items: center; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.bar .time { font: 500 13px/1 var(--mono); min-width: 11ch; text-align: right; font-variant-numeric: tabular-nums; }
.bar select { font: 12px var(--mono); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
.strip { grid-column: 1 / -1; height: 48px; width: 100%; display: none; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.strip.on { display: block; }
.side { grid-area: side; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.side h2 { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.read { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.read div { border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; font-size: 12px; }
.read label { display: flex; align-items: center; gap: 6px; }
.sval { border: 1px solid var(--line-2); border-radius: 4px; padding: 8px 10px; font: 12px/1.5 var(--mono); }
.sval output { font-weight: 600; font-size: 16px; } .sval.bad { border-color: var(--bad); background: var(--bad-soft); }
.grp { border-top: 1px solid var(--line-2); padding-top: 6px; }
.grp header { display: flex; justify-content: space-between; font-weight: 500; font-size: 13px; }
.grp header label { font-weight: 400; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.grp ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.grp li { display: grid; grid-template-columns: 16px 12px 1fr auto; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
.grp li.off { color: var(--muted); }
.grp li i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line); display: inline-block; }
.grp li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp li .mass { font: 11px/1 var(--mono); color: var(--muted); }
.grp li .bought { font: 10px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.4; }
input[type=checkbox] { accent-color: var(--accent); margin: 0; }
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: 1fr; grid-template-areas: "head" "stage" "bar" "side"; }
  .stage { height: 58vh; } .side { max-height: none; }
}
body.rec .views, body.rec .hud, body.rec .bar, body.rec .side, body.rec header { display: none; }
body.rec .app { padding: 0; grid-template-columns: 1fr; grid-template-rows: 1fr; grid-template-areas: "stage"; gap: 0; }
body.rec .stage { border: 0; border-radius: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <span class="chip" id="mass"></span>
  </header>
  <div class="stage" id="stage">
    <div class="views" id="views"></div>
    <div class="hud" id="hud"></div>
  </div>
  <div class="bar">
    <button type="button" id="play">pause</button>
    <input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="time">
    <span class="time"><span id="t-now">0.00</span> / <span id="t-end">0.0</span> s</span>
    <select id="speed" aria-label="playback speed"><option value="0.25">x0.25</option><option value="0.5">x0.5</option><option value="1" selected>x1</option><option value="2">x2</option></select>
    <canvas class="strip" id="strip" aria-label="readout over the cycle"></canvas>
  </div>
  <aside class="side">
    <div id="series"></div>
    <div class="read">
      <div><label><input type="checkbox" id="printed-only"> printed only</label></div>
      <div><label><input type="checkbox" id="explode"> exploded</label></div>
      <div><label><input type="checkbox" id="wire"> wireframe</label></div>
      <div><label><input type="checkbox" id="grid" checked> grid</label></div>
    </div>
    <h2>Parts</h2>
    <div id="parts"></div>
    <p class="note" id="note"></p>
  </aside>
</div>

wAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/OMQfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/8fAfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAP/HwH0MAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD/x8B9DAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/8fAfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAP/HwH0MAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD/x8B9DAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/8fAfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAP/HwH0MAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD/x8B9DAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/8fAfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAP/HwH0MAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD/x8B9DAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/8fAfQwAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAP/HwH0MAAAAAAAAAAAAAAAAAAIA/AACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD/x8B9DAAAAAAAAAAAAAAAAAACAPwAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAIA/AAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAIA/", "series": [], "views": {"iso": {"eye": [330.0, -380.0, 260.0], "target": [0.0, 0.0, 0.0]}, "side": {"eye": [0.0, -560.0, 10.0], "target": [0.0, 0.0, 0.0]}, "front": {"eye": [560.0, 0.0, 10.0], "target": [0.0, 0.0, 0.0]}, "top": {"eye": [0.0, 0.0, 620.0], "target": [0.0, 0.0, 0.0]}, "under" <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
$('title').innerHTML = D.title + (D.subtitle ? '<small>' + D.subtitle.replace(/</g, '&lt;') + '</small>' : '');
$('mass').textContent = D.mass_total ? D.mass_total.toFixed(1) + ' g printed (M; ' + D.material + ' density E)' : 'no printed mass';
$('note').textContent = 'Masses: mesh volume (M) x ' + (D.material === 'TPU' ? '1.21' : '1.27') + ' g/cm3 solid (E). Bought parts are context. Drag to orbit, wheel to zoom, right-drag to pan.';

// ---------- meshes
function b64(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  for (let k = 0; k < q.length; k++) pos[k] = q[k] * 0.02 + m.off[k % 3];
  const n8 = new Int8Array(b64(m.nrm).buffer); const nrm = new Float32Array(n8.length);
  for (let k = 0; k < n8.length; k++) nrm[k] = n8[k] / 127;
  const ib = b64(m.i).buffer; const idx = m.big ? new Uint32Array(ib) : new Uint16Array(ib);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeBoundingBox(); return g;
}
const G = {}; for (const k in D.meshes) G[k] = geom(D.meshes[k]);

// ---------- scene
const stage = $('stage');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); }
catch (e) { stage.insertAdjacentHTML('beforeend', '<p style="position:absolute;inset:40% 16px auto;text-align:center">This viewer needs WebGL. Open it in Chrome or Edge.</p>'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 10000); camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(1, -1.3, 1.6); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-1.5, 1, 0.6); scene.add(fill);

const objs = {}, mats = [], groups = {};
for (const p of D.parts) {
  const mat = new THREE.MeshStandardMaterial({ color: p.color, metalness: 0.05, roughness: 0.6 });
  const mesh = new THREE.Mesh(G[p.mesh], mat); mesh.matrixAutoUpdate = false;
  scene.add(mesh); objs[p.name] = { mesh, part: p, on: true }; mats.push(mat);
  (groups[p.group] = groups[p.group] || []).push(p.name);
}
// bounds at frame 0 for the camera, grid and explode offsets
const F = new Float32Array(b64(D.frames).buffer); const NP = D.parts.length, N = D.n_frames;
const M = new THREE.Matrix4();
function frameMatrix(i, j) { const o = (i * NP + j) * 16; M.set(F[o], F[o+1], F[o+2], F[o+3], F[o+4], F[o+5], F[o+6], F[o+7], F[o+8], F[o+9], F[o+10], F[o+11], F[o+12], F[o+13], F[o+14], F[o+15]); return M; }
const box = new THREE.Box3();
D.parts.forEach((p, j) => { const b = G[p.mesh].boundingBox.clone().applyMatrix4(frameMatrix(0, j)); box.union(b); });
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3()), R = Math.max(size.x, size.y, size.z);
const gridH = new THREE.GridHelper(Math.ceil(R * 2 / 50) * 50, Math.ceil(R * 2 / 50), 0x888888, dark ? 0x2a2f38 : 0xd8dbe0);
gridH.rotation.x = Math.PI / 2; gridH.position.set(center.x, center.y, box.min.z - 0.5); scene.add(gridH);
const gkeys = Object.keys(groups); const gcen = {};
gkeys.forEach(g => { const b = new THREE.Box3(); groups[g].forEach(n => { const j = D.parts.findIndex(p => p.name === n); b.union(G[D.parts[j].mesh].boundingBox.clone().applyMatrix4(frameMatrix(0, j))); }); gcen[g] = b.getCenter(new THREE.Vector3()); });

// ---------- views
const VIEWS = Object.assign({
  iso: { eye: [R * 0.9, -R * 1.3, R * 0.9] }, top: { eye: [0, -0.01, R * 2.2] }, front: { eye: [0, -R * 2.2, 0] }, side: { eye: [R * 2.2, 0, 0] } }, D.views);
function setView(name) {
  const v = VIEWS[name] || VIEWS.iso; const tgt = v.target ? new THREE.Vector3(...v.target) : center.clone();
  const k = camera.aspect < 1 ? 1 / camera.aspect : 1;            // narrow (phone) viewports: back off so the width fits
  const eye = D.views[name] ? new THREE.Vector3(...v.eye) : tgt.clone().add(new THREE.Vector3(...v.eye).multiplyScalar(k));
  camera.position.copy(eye); controls.target.copy(tgt); controls.update();
}
for (const nm of Object.keys(VIEWS)) { const b = document.createElement('button'); b.type = 'button'; b.textContent = nm; b.onclick = () => setView(nm); $('views').appendChild(b); }

// ---------- parts panel
let printedOnly = false, explode = 0;
const panel = $('parts');
for (const g of gkeys) {
  const d = document.createElement('div'); d.className = 'grp';
  const mass = groups[g].reduce((s, n) => s + (D.meshes[objs[n].part.mesh].mass || 0), 0);
  d.innerHTML = '<header><span>' + g + (mass ? ' <span class="mass">' + mass.toFixed(1) + ' g</span>' : '') + '</span><label><input type="checkbox" checked> show</label></header><ul></ul>';
  const ul = d.querySelector('ul'); const gcb = d.querySelector('header input');
  for (const n of groups[g]) {
    const p = objs[n].part, m = D.meshes[p.mesh];
    const li = document.createElement('li');
    li.innerHTML = '<input type="checkbox" checked><i style="background:' + p.color + '"></i><span class="nm" title="' + (p.note || '') + '">' + n + '</span>' +
      (p.printed ? '<span class="mass">' + (m.mass != null ? m.mass.toFixed(1) + ' g' : '') + '</span>' : '<span class="bought">bought</span>');
    const cb = li.querySelector('input'); cb.onchange = () => { objs[n].on = cb.checked; li.classList.toggle('off', !cb.checked); apply(); };
    objs[n].li = li; objs[n].cb = cb; ul.appendChild(li);
  }
  gcb.onchange = () => { for (const n of groups[g]) { objs[n].cb.checked = gcb.checked; objs[n].on = gcb.checked; objs[n].li.classList.toggle('off', !gcb.checked); } apply(); };
  panel.appendChild(d);
}
$('printed-only').onchange = e => { printedOnly = e.target.checked; apply(); };
$('explode').onchange = e => { explode = e.target.checked ? 1 : 0; apply(); };
$('wire').onchange = e => mats.forEach(m => m.wireframe = e.target.checked);
$('grid').onchange = e => gridH.visible = e.target.checked;

// ---------- series strip
const strip = $('strip'), sbox = $('series');
if (D.series.length) {
  strip.classList.add('on');
  for (const s of D.series) { const d = document.createElement('div'); d.className = 'sval'; d.id = 'sv-' + s.name; d.innerHTML = s.name + '<br><output>-</output> ' + s.unit; sbox.appendChild(d); }
}
function drawStrip(i) {
  if (!D.series.length) return;
  const w = strip.clientWidth, h = strip.clientHeight; strip.width = w * devicePixelRatio; strip.height = h * devicePixelRatio;
  const c = strip.getContext('2d'); c.scale(devicePixelRatio, devicePixelRatio); c.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  D.series.forEach((s, k) => {
    const v = s.values.filter(x => x != null); if (!v.length) return;
    const lo = Math.min(...v), hi = Math.max(...v), sp = (hi - lo) || 1;
    c.strokeStyle = k ? css.getPropertyValue('--muted') : css.getPropertyValue('--accent'); c.lineWidth = 1.5; c.beginPath();
    s.values.forEach((x, j) => { if (x == null) return; const px = j / (N - 1) * w, py = h - 4 - (x - lo) / sp * (h - 8); j ? c.lineTo(px, py) : c.moveTo(px, py); });
    c.stroke();
    if (s.bad_below != null && s.bad_below >= lo && s.bad_below <= hi) { const py = h - 4 - (s.bad_below - lo) / sp * (h - 8); c.strokeStyle = css.getPropertyValue('--bad'); c.setLineDash([3, 3]); c.beginPath(); c.moveTo(0, py); c.lineTo(w, py); c.stroke(); c.setLineDash([]); }
  });
  c.strokeStyle = css.getPropertyValue('--fg'); c.beginPath(); const px = i / (N - 1) * w; c.moveTo(px, 0); c.lineTo(px, h); c.stroke();
}

// ---------- playback
let cur = 0, playing = true, acc = 0, last = performance.now();
const scrub = $('scrub'); scrub.max = N - 1; $('t-end').textContent = D.duration.toFixed(1);
const msPerFrame = D.duration * 1000 / N;
const tmp = new THREE.Matrix4(), tr = new THREE.Vector3();
function apply() {
  const i = cur;
  D.parts.forEach((p, j) => {
    const o = objs[p.name]; const show = o.on && !(printedOnly && !p.printed);
    o.mesh.visible = show; if (!show) return;
    o.mesh.matrix.copy(frameMatrix(i, j));
    if (explode) { const gc = gcen[p.group]; tr.copy(gc).sub(center).multiplyScalar(0.6 * explode); tmp.makeTranslation(tr.x, tr.y, tr.z); o.mesh.matrix.premultiply(tmp); }
  });
  scrub.value = i; $('t-now').textContent = (i / N * D.duration).toFixed(2);
  $('hud').textContent = 'frame ' + i + ' / ' + N;
  D.series.forEach(s => { const v = s.values[i]; const el = document.querySelector('#sv-' + CSS.escape(s.name)); if (!el) return; el.querySelector('output').textContent = v == null ? '-' : v.toFixed(2);
    el.classList.toggle('bad', v != null && ((s.bad_below != null && v < s.bad_below) || (s.bad_above != null && v > s.bad_above))); });
  drawStrip(i);
}
function setFrame(i) { cur = ((i % N) + N) % N; apply(); }
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'pause' : 'play'; };
scrub.oninput = e => { playing = false; $('play').textContent = 'play'; setFrame(+e.target.value); };
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); drawStrip(cur); });
resize(); setView('iso'); setFrame(0);
function loop(now) {
  if (playing && N > 1) { acc += (now - last) * +$('speed').value; while (acc >= msPerFrame) { acc -= msPerFrame; setFrame(cur + 1); } }
  last = now; controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- headless hooks
window.__motion = { ready: true, n: N,
  setFrame: i => { playing = false; setFrame(i); renderer.render(scene, camera); },
  record: (w, h, view) => { document.body.classList.add('rec'); renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); setView(view || 'iso'); renderer.render(scene, camera); } };
