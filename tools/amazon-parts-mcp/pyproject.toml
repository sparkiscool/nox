[project]
name = "amazon-parts-mcp"
version = "0.1.0"
description = "MCP server for finding and ordering drone parts on Amazon from a chat session"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2,<3",
]

[project.scripts]
amazon-parts-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
